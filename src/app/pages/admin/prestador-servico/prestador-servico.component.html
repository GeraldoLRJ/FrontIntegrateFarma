<div class="row">
    <div [ngClass]="showSideBar ? 'col-8' : 'col-12'" class="col-8">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <div class="row">
                    <div class="col-6">
                        Lista de Prestadores de Serviços
                    </div>
                    <div class="col-6 text-end">
                        <button class="btn btn-sm btn-success" (click)="onCreate()">Novo</button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-3" *ngFor="let prestadorServico of prestadorServicoList">
                        <div class="card">
                            <div class="card-body">
                              <h4 class="card-title">{{prestadorServico.nome}}</h4>
                                <a class="btn btn-primary" (click)="onEditing(prestadorServico)">Editar</a>
                                <a class="btn btn-danger mx-2" (click)="onDelete(prestadorServico.idPrestadorServico)">Apagar</a>
                            </div>
                          </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="col-4" *ngIf="showSideBar">
        <div class="card">
            <div class="card-header bg-primary text-white">
                <div class="row">
                    <div class="col-6">
                        {{this.titleSideBar}}
                    </div>
                    <div class="col-6 text-end">
                        <button class="btn btn-sm btn-danger" (click)="closeSideBar()">Fechar</button>
                    </div>
                </div>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-6">
                        <label for="">Nome do Prestador</label>
                        <input type="text" [(ngModel)]="prestadorServicoObj.nome" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">Valor</label>
                        <input type="number" [(ngModel)]="prestadorServicoObj.valor" class="form-control">
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <label for="">Email</label>
                        <input type="text" [(ngModel)]="prestadorServicoObj.email" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">Numero de Telefone</label>
                        <input type="number" [(ngModel)]="prestadorServicoObj.numero" class="form-control">
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <label for="">CRM</label>
                        <input type="text" [(ngModel)]="prestadorServicoObj.crm" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="">CPF</label>
                        <input type="text" [(ngModel)]="prestadorServicoObj.cpf" class="form-control">
                    </div>
                </div>
                <div class="row">
                    <div class="col-6">
                        <label for="">Nome do Cargo</label>
                        <input type="text" [(ngModel)]="prestadorServicoObj.nomeCargo" class="form-control">
                    </div>
                    <div class="col-6">
                        <label for="especialidade">Especialidade</label>
                        <select id="especialidade" class="form-control" [(ngModel)]="prestadorServicoObj.idEspecialidade" (change)="updateEspecialidade()">
                            <option *ngFor="let item of tipoServicoList" [value]="item.idEspecialidade">
                                {{ item.nomeEspecialidade }}
                            </option>
                        </select>
                    </div>
                    
                </div>
                <div class="row">
                    <div class="col-6">
                        <label for="usuario-admin">Usuario</label>
                        <select id="usuario-admin" class="form-control" [(ngModel)]="prestadorServicoObj.idUsuario" (change)="updateUsuarioAdmin()">
                            <option *ngFor="let item of usuarioAdminList" [value]="item.idUsuario">
                                {{ item.nome }}
                            </option>
                        </select>
                    </div>
                </div>
                <div class="row" style="margin-top: 10px;">
                    <div class="row">
                        <div class="col-6">
                            <button class="btn btn-success" (click)="onSave(prestadorServicoObj)" *ngIf="!this.editing">Criar</button>
                            <button class="btn btn-success" (click)="onEdit(prestadorServicoObj)" *ngIf="this.editing">Editar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
